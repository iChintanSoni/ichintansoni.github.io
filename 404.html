<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Chintan Soni</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #07070b; color: #f2f2f6; font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    .code { font-family: Syne, sans-serif; font-weight: 800; font-size: clamp(5rem, 22vw, 14rem); line-height: .9; letter-spacing: -.05em; background: linear-gradient(120deg, #8b7cff, #4fe3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #a9a9b8; margin: 20px 0 32px; }
    a { display: inline-block; padding: 14px 24px; border-radius: 999px; background: #f2f2f6; color: #07070b; text-decoration: none; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", monospace; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: #70707f; }
  </style>
</head>
<body>
  <div>
    <div class="mono">Page not found</div>
    <div class="code">404</div>
    <p>This route has no agent assigned to it.</p>
    <a href="/">Back home</a>
  </div>
</body>
</html>
